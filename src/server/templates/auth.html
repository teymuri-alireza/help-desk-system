<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود و ثبت نام | دانشگاه دانش و فناوری</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <h2>دانشگاه دانش و فناوری</h2>
            </div>

            <ul class="nav-links">
                <li><a href="/">صفحه اصلی</a></li>
            </ul>

            <!-- Keep empty div to balance navbar -->
            <div></div>
        </nav>
    </header>

    <main class="auth-page">

        <section class="auth-header">
            <h1>سامانه ورود و ثبت نام</h1>
            <p>
                برای استفاده از خدمات آموزشی و دانشجویی وارد حساب کاربری خود شوید
                یا یک حساب جدید ایجاد کنید.
            </p>
        </section>

        <div class="forms-container">

            <!-- Login Form -->
            <section class="auth-card" id="login-section">
                <h2>ورود به سامانه</h2>

                <form id="login-form">

                    <p style="justify-self: center;" class="alert alert-warning">
                        به علت آزمایشی بودن این سامانه فرم ورود ساده سازی شده است.
                    </p>

                    <div class="form-group">
                        <label for="login-username">نام کاربری (شماره دانشجویی یا شماره کارمندی)</label>
                        <input type="text" id="login-username" name="username" required placeholder="نام کاربری خود را وارد کنید">

                        <p
                             id="login-error"
                             class="alert alert-danger"
                             style="display:none;"
                        ></p>

                    </div>

                    <button type="submit" class="submit-btn">
                        ورود به حساب
                    </button>

                </form>
            </section>

            <!-- Signup Form -->
            <section class="auth-card" id="signup-section">
                <h2>ثبت نام دانشجو</h2>

                <p
                    id="signup-error"
                    class="alert alert-danger"
                    style="display:none;"
                ></p>

                <form id="signup-form">

                    <div class="form-group">
                        <label for="fullname">نام و نام خانوادگی</label>
                        <input type="text" id="fullname" name="name" required placeholder="نام و نام خانوادگی">
                    </div>

                    <div class="form-group">
                        <label for="user-id">شماره دانشجویی</label>
                        <input type="text" id="user-id" name="username" required placeholder="شماره دانشجویی">
                    </div>

                    <div class="form-group">
                        <label for="email">ایمیل</label>
                        <input type="email" id="email" name="email" required placeholder="example@university.edu">
                    </div>

                    <button class="submit-btn">
                        ایجاد حساب کاربری
                    </button>

                </form>
            </section>

        </div>

    </main>
<script src="{{ url_for('static', path='js/auth.js') }}"></script>
</body>
</html>
