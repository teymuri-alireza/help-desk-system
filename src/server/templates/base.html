<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title%}{% endblock %} | دانشگاه دانش و فناوری</title>
    {% block css %}{% endblock %}
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <h2>دانشگاه دانش و فناوری</h2>
        </div>

        <ul class="nav-links">
            <li><a href="/">صفحه اصلی</a></li>
            <li><a href="#" id="profile-link">پروفایل کاربر</a></li>
            <li class="notifications-dropdown">
                <a href="/notifications/all" class="notifications-trigger">اعلان‌ها</a>
                <div class="notifications-menu" id="notifications-menu"></div>
            </li>
        </ul>

        <div class="auth-buttons">
            <a id="logout-btn" class="btn register-btn" style="cursor: pointer;">خروج</a>
        </div>
    </nav>
</header>

{% block early_js %}{% endblock %}

<main class="ops-dashboard">

    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>داشبورد - کاربر <span id="dashboard-username">...</span></h3>
        </div>
        {% block aside %}{% endblock %}
    </aside>

    <section class="dashboard-content">
        {% block content %}{% endblock %}
    </section>
</main>

{% block js %}{% endblock %}

<script src="{{ url_for('static', path='js/logout.js') }}"></script>

<script>
    (function () {
        const profileLink = document.getElementById("profile-link");
        const dashboardUsername = document.getElementById("dashboard-username");

        fetch("/api/auth/me", {
            method: "GET",
            credentials: "same-origin",
        })
            .then((response) => {
                if (response.status === 401) {
                    window.location.href = "/login";
                    return null;
                }

                if (!response.ok) {
                    throw new Error(`Unexpected response status: ${response.status}`);
                }

                return response.json();
            })
            .then((data) => {
                if (!data) {
                    return;
                }

                if (profileLink) {
                    profileLink.href = `/users/${data.user_id}`;
                }

                if (dashboardUsername) {
                    dashboardUsername.textContent = data.user_username;
                }
            })
            .catch((error) => {
                console.error("Failed to fetch user information:", error);
            });
    })();
</script>
</body>
</html>
